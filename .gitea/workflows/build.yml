name: Build NMS-SM-EVB_tests
run-name: ${{ gitea.actor }} is building nms-sm-evb_tests

on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: dev.incomsystem.ru:3000/plc/settings_manager-bullseye-arm64:latest
            deb_name: nms-sm-evb_tests.deb
            arch_tag: arm64
            platform: linux/arm64
            target_arch: arm64
    steps:
      - name: Login to dev.incomsystem.ru
        uses: docker/login-action@v3
        with:
          registry: ${{ gitea.server_url }}
          username: ${{ secrets.CI_USER }}
          password: ${{ secrets.CI_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: https://github.com/docker/setup-qemu-action@v3

      - name: Set up Python
        uses: https://github.com/actions/setup-python@v4
        with:
          python-version: '3.9.2'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build artifacts toolchain container
        run: |
          WORKSPACE_DIR="${GITHUB_WORKSPACE:-$PWD}"
          docker pull --platform "${{ matrix.platform }}" "${{ matrix.image }}"
          CONTAINER_ID=$(docker create --platform "${{ matrix.platform }}" "${{ matrix.image }}" /bin/bash -lc "SRC_DIR=/src OUT_DIR=/out TARGETARCH=${{ matrix.target_arch }} /src/build/build.sh")
          trap 'docker rm -v ${CONTAINER_ID} || true' EXIT
          docker cp "${WORKSPACE_DIR}/." "${CONTAINER_ID}:/src"
          docker start -a "${CONTAINER_ID}"
          docker cp "${CONTAINER_ID}:/out/${{ matrix.deb_name }}" "./${{ matrix.deb_name }}"

      - name: Archive Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: nms-sm-evb_tests-${{ matrix.arch_tag }}
          path: ${{ matrix.deb_name }}

  publish-release:
    runs-on: ubuntu-latest
    if: gitea.ref_type == 'tag'
    name: Publish release
    needs: build
    steps:
      - uses: actions/download-artifact@v2
        with:
          name: nms-sm-evb_tests-arm64
          path: .
      - name: Publish release
        uses: actions/gitea-release-action@main
        with:
          api_key: '${{ secrets.CI_TOKEN }}'
          prerelease: true
          files: |
            nms-sm-evb_tests_arm64.deb